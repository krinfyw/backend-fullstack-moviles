spring.application.name=backend-fullstack-moviles

# NO DEJEN LAS PROPIEDADES DE CONEXION DE LA BASE DE DATOS CUANDO LO SUBAN A GITHUB.
spring.datasource.url=jdbc:mysql://endpoint:3306/sonido_vivo_DB
spring.datasource.username=usuario
spring.datasource.password=contrasena
spring.jpa.hibernate.ddl-auto=validate

# JWT. El secreto real va en application-local.properties (no se sube a GitHub).
# Este valor de ejemplo es corto a proposito: el login falla si no lo reemplazan.
app.jwt.secret=clave-secreta-para-generar-el-jwt
app.jwt.expiracion-minutos=60

app.cors.origen=http://ip:5173/
